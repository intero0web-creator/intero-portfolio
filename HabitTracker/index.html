<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Трекер привычек</title>
<meta name="description" content="Трекер привычек: матрица привычек по дням недели, кольцо прогресса за сегодня, серии (стрики) и категории. Данные хранятся локально в браузере."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="app-shell">

  <!-- ==== SIDEBAR ==== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
      <span class="brand-name">Привычки</span>
    </div>

    <!-- Кольцо прогресса за сегодня — главный фокус вместо ряда карточек -->
    <div class="ring-block">
      <div class="ring-tag">Сегодня</div>
      <div class="ring-wrap-glow" aria-hidden="true"></div>
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#5EEBB8"/>
              <stop offset="100%" stop-color="#22C58C"/>
            </linearGradient>
          </defs>
          <g transform="rotate(-90 60 60)">
            <circle class="ring-track" cx="60" cy="60" r="52"/>
            <circle class="ring-val" id="ringVal" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7" stroke="url(#ringGrad)"/>
          </g>
        </svg>
        <div class="ring-center">
          <div class="ring-num" id="ringPct">0%</div>
          <div class="ring-frac" id="ringFrac">0 / 0</div>
        </div>
      </div>
    </div>

    <div class="side-stats">
      <div class="side-stat"><b id="statStreak">—</b><span>Серия</span></div>
      <div class="side-stat"><b id="statRate">—</b><span>За неделю</span></div>
      <div class="side-stat"><b id="statTotal">0</b><span>Всего</span></div>
    </div>

    <nav class="cat-nav" id="catNav" aria-label="Фильтр по категории"></nav>

    <button type="button" class="add-toggle" id="addToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Добавить привычку
    </button>
    <form class="add-panel" id="addForm">
      <input type="text" id="fName" name="name" placeholder="Название, например «читать 20 мин»" maxlength="60" required/>
      <select id="fCategory" name="category"></select>
      <div class="add-panel-actions">
        <button type="button" class="add-cancel" id="addCancel">Отмена</button>
        <button type="submit" class="add-submit">Добавить</button>
      </div>
    </form>
  </aside>

  <!-- ==== MAIN ==== -->
  <main class="main">
    <div class="main-head">
      <div class="main-title">
        Матрица привычек
        <small>Кликните по ячейке, чтобы отметить день</small>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="Поиск по названию…"/>
      </div>
    </div>

    <div class="week-nav">
      <div class="week-nav-btns">
        <button type="button" class="week-btn" id="weekPrev" aria-label="Предыдущая неделя">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="week-range" id="weekRange">—</div>
        <button type="button" class="week-btn" id="weekNext" aria-label="Следующая неделя">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <button type="button" class="week-today" id="weekToday">Сегодня</button>
    </div>

    <div class="matrix-wrap" id="matrixTable">
      <div class="mg-head" id="matrixHead"></div>
      <div class="mg-body" id="matrixBody"></div>
    </div>

    <div class="empty" id="empty" style="display:none">
      <div class="empty-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      </div>
      <p>Привычек пока нет.</p>
    </div>

    <p class="footer-note">Стрик считается по реальному сегодняшнему дню независимо от того, какая неделя открыта. Всё хранится в этом браузере.</p>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
