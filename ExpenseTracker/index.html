<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Учёт расходов</title>
<meta name="description" content="Трекер расходов с категориями, поиском и фильтром по периоду (сегодня/неделя/месяц). Данные хранятся локально в браузере, можно скачать историю в CSV или JSON."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="wrap">

  <header class="app-header">
    <div class="app-header-row">
      <div class="app-title">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </span>
        Учёт расходов
      </div>
      <div class="export-box">
        <select id="exportFormat" aria-label="Формат экспорта">
          <option value="csv">CSV</option>
          <option value="json">JSON</option>
        </select>
        <button type="button" class="export-btn" id="exportBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Скачать данные
        </button>
      </div>
    </div>
    <p class="app-sub">Данные хранятся только в этом браузере — localStorage</p>
  </header>

  <section class="stats" aria-label="Статистика">
    <div class="stat-card">
      <div class="stat-val accent" id="statTotal">0 ₽</div>
      <div class="stat-lbl">Всего потрачено</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statCount">0</div>
      <div class="stat-lbl">Записей</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statAvg">—</div>
      <div class="stat-lbl">Средний чек</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statTop">—</div>
      <div class="stat-lbl">Больше всего</div>
    </div>
  </section>

  <form class="add-card" id="addForm">
    <div class="add-grid">
      <div class="field">
        <label for="fAmount">Сумма, ₽</label>
        <input type="number" id="fAmount" name="amount" min="0" step="1" placeholder="0" required/>
      </div>
      <div class="field">
        <label for="fNote">Заметка</label>
        <input type="text" id="fNote" name="note" placeholder="Например: обед в кафе" maxlength="80"/>
      </div>
      <div class="field">
        <label for="fCategory">Категория</label>
        <select id="fCategory" name="category"></select>
      </div>
      <button type="submit" class="add-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Добавить
      </button>
    </div>
    <div class="add-row2">
      <div class="field">
        <label for="fDate">Дата</label>
        <input type="date" id="fDate" name="date"/>
      </div>
    </div>
  </form>

  <div class="filters">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Поиск по заметке…"/>
    </div>
    <div class="period-toggle" role="group" aria-label="Период">
      <button type="button" class="active" data-period="all" aria-pressed="true">Всё время</button>
      <button type="button" data-period="month" aria-pressed="false">Месяц</button>
      <button type="button" data-period="week" aria-pressed="false">Неделя</button>
      <button type="button" data-period="today" aria-pressed="false">Сегодня</button>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="list" id="list"></div>

  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2H10a2 2 0 0 0-2 2v16"/></svg>
    <p>Записей пока нет.</p>
  </div>

  <p class="footer-note">Всё считается прямо в браузере, ничего не отправляется на сервер.</p>

</div>

<script src="script.js"></script>
</body>
</html>
